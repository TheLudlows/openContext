[package]
name = "opencontext-storage-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "opencontext-storage-probe"

[[bin]]
name = "probe-protoc"
path = "src/protoc.rs"
required-features = ["build-tools"]

# Isolated from the application's dependency graph and runtime paths.
[workspace]
resolver = "3"

[features]
default = ["sqlite", "vector", "graph"]
sqlite = ["dep:sqlx"]
vector = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]
graph = ["dep:kuzu", "dep:cxx-build"]
build-tools = ["dep:protoc-bin-vendored"]

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
lancedb = { version = "=0.23.1", default-features = false, optional = true }
arrow-array = { version = "56.2", optional = true }
arrow-schema = { version = "56.2", optional = true }
futures = { version = "0.3", optional = true }
kuzu = { version = "=0.11.3", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

# kuzu pins cxx = 1.0.138 but leaves its bridge generator unconstrained.
# Newer generators emit different symbol names and fail during final linking.
[build-dependencies]
cxx-build = { version = "=1.0.138", optional = true }

[profile.dev]
debug = 0

[profile.dev.build-override]
debug = 0
