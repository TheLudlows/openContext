<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#66788f"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="65" y="67" font-family="Microsoft YaHei UI, sans-serif" font-size="38" font-weight="700" fill="#20334b">两种检索：混合证据与图关系评分</text>
<text x="65" y="115" font-family="Microsoft YaHei UI, sans-serif" font-size="25" font-weight="400" fill="#5d7087">两种策略使用不同的候选构造与评分方式，不应合并成一个模糊的“图增强”。</text>
<polyline points="570,270 650,270" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1150,270 1230,270" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="570,645 650,645" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1150,645 1230,645" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="190" width="500" height="160" rx="14" fill="#eaf2ff" stroke="#c7d4e2"/>
<text x="92" y="233" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">混合检索：四类入口</text>
<text x="92" y="273" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">原文 + 摘要</text>
<text x="92" y="306" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">实体 + 事实句</text>
<rect x="650" y="190" width="500" height="160" rx="14" fill="#eaf2ff" stroke="#c7d4e2"/>
<text x="672" y="233" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">各路组织证据</text>
<text x="672" y="273" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">原文与摘要按排名融合</text>
<text x="672" y="306" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">实体补充关系；保留事实候选</text>
<rect x="1230" y="190" width="500" height="160" rx="14" fill="#e8f5ef" stroke="#c7d4e2"/>
<text x="1252" y="233" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">组合回答上下文</text>
<text x="1252" y="273" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">相关段落 + 实体关系 + 事实</text>
<text x="1252" y="306" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">不同视图互相补充</text>
<rect x="70" y="565" width="500" height="160" rx="14" fill="#f0ecff" stroke="#c7d4e2"/>
<text x="92" y="608" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">图检索：语义候选</text>
<text x="92" y="648" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">搜索节点与关系语义</text>
<text x="92" y="681" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">准备图范围和向量距离</text>
<rect x="650" y="565" width="500" height="160" rx="14" fill="#f0ecff" stroke="#c7d4e2"/>
<text x="672" y="608" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">为关系整体评分</text>
<text x="672" y="648" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">头节点 + 关系 + 尾节点</text>
<text x="672" y="681" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">考虑重要性与反馈权重</text>
<rect x="1230" y="565" width="500" height="160" rx="14" fill="#e8f5ef" stroke="#c7d4e2"/>
<text x="1252" y="608" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">选出相关关系</text>
<text x="1252" y="648" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">取综合距离较小的关系</text>
<text x="1252" y="681" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">转成可读证据后生成答案</text>
<text x="70" y="435" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#5d7087">混合检索重点：保留原文证据，用摘要提高表达覆盖；并不是所有候选都采用同一个 RRF 公式。</text>
<text x="70" y="845" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#5d7087">图检索重点：衡量一条关系及其两端的相关性；没有召回的组成部分会得到缺失惩罚。</text>
<text x="70" y="905" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#5d7087">复刻时分别记录两种策略的候选覆盖率、排序质量、耗时和上下文长度，才能定位收益来源。</text>
<text x="65" y="1095" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="400" fill="#718198">Cognee 1.6.0 · 主流程示意 · 默认能力与可选能力见正文</text>
</svg>