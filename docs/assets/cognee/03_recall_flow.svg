<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1110" viewBox="0 0 1800 1110">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#66788f"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="65" y="67" font-family="Microsoft YaHei UI, sans-serif" font-size="38" font-weight="700" fill="#20334b">检索主流程：从提问到有依据的回答</text>
<text x="65" y="115" font-family="Microsoft YaHei UI, sans-serif" font-size="25" font-weight="400" fill="#5d7087">先选择检索范围，再检索；会话命中是否跳过知识检索取决于调用方式。</text>
<polyline points="570,255 650,255" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1150,255 1230,255" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1480,335 1480,490" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1230,570 1150,570" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="650,570 570,570" fill="none" stroke="#66788f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="175" width="500" height="160" rx="14" fill="#eef2f6" stroke="#c7d4e2"/>
<text x="92" y="218" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">1  用户提问</text>
<text x="92" y="258" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">问题 + 数据集范围</text>
<text x="92" y="291" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">可附会话 ID 与指定检索方式</text>
<rect x="650" y="175" width="500" height="160" rx="14" fill="#eaf2ff" stroke="#c7d4e2"/>
<text x="672" y="218" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">2  确定范围</text>
<text x="672" y="258" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">会话优先 / 会话与知识 / 仅知识</text>
<text x="672" y="291" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">先应用访问范围</text>
<rect x="1230" y="175" width="500" height="160" rx="14" fill="#f0ecff" stroke="#c7d4e2"/>
<text x="1252" y="218" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">3  召回候选</text>
<text x="1252" y="258" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">会话问答、原文、摘要</text>
<text x="1252" y="291" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">实体和事实关系</text>
<rect x="1230" y="490" width="500" height="160" rx="14" fill="#eaf2ff" stroke="#c7d4e2"/>
<text x="1252" y="533" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">4  选择证据</text>
<text x="1252" y="573" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">混合检索：多路合并</text>
<text x="1252" y="606" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">图检索：关系与两端节点评分</text>
<rect x="650" y="490" width="500" height="160" rx="14" fill="#e8f5ef" stroke="#c7d4e2"/>
<text x="672" y="533" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">5  组装上下文</text>
<text x="672" y="573" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">证据 + 近期会话 + 可用指导</text>
<text x="672" y="606" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">交给模型回答，或直接返回证据</text>
<rect x="70" y="490" width="500" height="160" rx="14" fill="#e8f5ef" stroke="#c7d4e2"/>
<text x="92" y="533" font-family="Microsoft YaHei UI, sans-serif" font-size="29" font-weight="700" fill="#20334b">6  返回并记账</text>
<text x="92" y="573" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">答案 / 检索结果</text>
<text x="92" y="606" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#20334b">记录所用证据，供后续反馈</text>
<text x="70" y="795" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#5d7087">图关系帮助补齐跨资料连接；原文用于核对限定条件；会话用于理解当前任务与近期修正。</text>
<text x="70" y="845" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#5d7087">会话结果与知识结果并不总是进入同一个总排序；“多来源返回”不等于“统一相关性排序”。</text>
<text x="70" y="895" font-family="Microsoft YaHei UI, sans-serif" font-size="24" font-weight="400" fill="#5d7087">答案更好与否取决于证据是否正确、身份是否合并正确，以及上下文是否控制了噪声。</text>
<text x="65" y="1085" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="400" fill="#718198">Cognee 1.6.0 · 主流程示意 · 默认能力与可选能力见正文</text>
</svg>